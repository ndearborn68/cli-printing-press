version: 2
project_name: findtalent-pp-cli
changelog:
  disable: true
builds:
  - id: findtalent-pp-cli
    main: ./cmd/findtalent-pp-cli
    binary: findtalent-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X findtalent-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: findtalent-pp-mcp
    main: ./cmd/findtalent-pp-mcp
    binary: findtalent-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: findtalent-pp-cli
    repository:
      owner: 
      name: homebrew-tap
    homepage: "https://github.com//findtalent-pp-cli"
    description: "FindTalent is a candidate-sourcing platform that helps recruiters find qualified candidates."
    install: |
      bin.install "findtalent-pp-cli"
      bin.install "findtalent-pp-mcp"
